name: test

on:
  push:
  pull_request:

jobs:
  test:
    # macOS only: that is where the plugin is used. zsh ships with macOS; mise installs glow (mise.toml).
    # Actions are pinned to a commit, so a moved tag cannot change what runs here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run ci
